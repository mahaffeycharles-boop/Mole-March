<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mole March</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="gameContainer">

<canvas
id="game"
width="1280"
height="720">
</canvas>

<div id="hud">

<div id="leftPanel">

<div class="tool" id="tool-builder">
🪵 Bridge
<span>99</span>
</div>

<div class="tool" id="tool-tunnel">
⛏ Tunnel
<span>99</span>
</div>

<div class="tool" id="tool-glider">
🍃 Leaf
<span>99</span>
</div>

<div class="tool" id="tool-bomb">
💥 Charge
<span>99</span>
</div>

</div>

<div id="centerPanel">

<div id="levelName">

Tutorial Mine

</div>

</div>

<div id="rightPanel">

<div>

Saved

<span id="savedCount">
0
</span>

</div>

<div>

Lost

<span id="lostCount">
0
</span>

</div>

<div>

Time

<span id="timeRemaining">
300
</span>

</div>

</div>

</div>

<div id="debugPanel">

<div>

FPS:
<span id="fps">
0
</span>

</div>

<div>

Moles:
<span id="moleCount">
0
</span>

</div>

<div>

Camera:

<span id="cameraPosition">

0 , 0

</span>

</div>

<div>

Tile:

<span id="tilePosition">

0 , 0

</span>

</div>

<div>

State:

<span id="gameState">

Loading

</span>

</div>

</div>

</div>

<script type="module" src="main.js"></script>

</body>

</html>
